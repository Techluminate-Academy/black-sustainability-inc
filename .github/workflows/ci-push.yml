# Same steps as CI, but only on push. Keeps feedback on feature/** branches without
# duplicating the PR-required check name "CI / Lint, Typecheck, Test, Build" (GitHub
# otherwise reports suffixed variants and branch protection never sees the bare name).
name: CI (push)

on:
  push:
    branches: [main, develop, "feature/**"]

jobs:
  test-and-lint:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test
        env:
          JWT_SECRET: ci-jwt-secret-not-for-production

      - name: Build
        run: npm run build
        env:
          JWT_SECRET: ci-jwt-secret-not-for-production
          NEXTAUTH_SECRET: ci-nextauth-secret-not-for-production
